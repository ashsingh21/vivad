# Standalone on purpose: its own workspace, so the game's build and lockfile never see it.
# Build it with `just textures-pack` (its output goes under the repo's ignored /target).
[package]
name = "texpack"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = "0.5"
ktx2 = "0.5"
zstd = "0.13"
rayon = "1"
bcdec_rs = "0.2"

[profile.release]
opt-level = 3

# The prebuilt ISPC encoder objects carry no platform tag; the linker says so, harmlessly.
[lints.rust]
linker_messages = "allow"
