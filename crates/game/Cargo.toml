[package]
name = "game"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true }
shared = { workspace = true }
avian3d = { workspace = true }
rand = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
# Reads the characters' and animals' files to bake flip books (crate::life); Bevy already builds it.
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
# Online play over iroh (in the browser through its relays).
net = { path = "../net" }

# The browser build: randomness from the Web Crypto API (see .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# WebGPU only (Chrome/Edge, Safari 26+): keeps the compute-driven sky and GPU culling.
bevy = { workspace = true, features = ["webgpu"] }
# The page's address, for ?map=, ?host and ?join=.
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

