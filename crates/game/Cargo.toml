[package]
name = "game"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true }
shared = { workspace = true }
avian3d = { workspace = true }
rand = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

# The browser build: randomness from the Web Crypto API (see .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# WebGPU only (Chrome/Edge, Safari 26+): keeps the compute-driven sky and GPU culling.
bevy = { workspace = true, features = ["webgpu"] }

# Online play over iroh (not in the browser build yet).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
net = { path = "../net" }
