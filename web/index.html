<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panga</title>
<style>
  :root {
    --bg: #1d1a17; --panel: #2a2520; --line: #4a4036; --text: #eee6da; --muted: #b3a796;
    --accent: #f2b544; --accent-ink: #231a08; --error: #ff8a7a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  [hidden] { display: none !important; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: 1px; color: var(--accent); }
  .tag { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; padding: 11px 12px; font-size: 15px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .err { color: var(--error); font-size: 13px; min-height: 1em; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="menu" hidden>
  <form class="card" id="form" autocomplete="off">
    <h1>Panga</h1>
    <p class="tag">Dilli ki galiyon mein last one standing.</p>
    <label for="name">Tumhara naam</label>
    <input id="name" maxlength="16" placeholder="Warrior">
    <label for="map">Map</label>
    <select id="map">
      <option value="cp">Connaught Place</option>
      <option value="chandni">Chandni Chowk</option>
      <option value="hauzkhas">Hauz Khas</option>
      <option value="indiagate">India Gate</option>
    </select>
    <div class="row">
      <button type="button" class="primary" id="solo">Akele khelo</button>
      <button type="button" id="host">Room banao</button>
    </div>
    <hr>
    <label for="code">Dost ka room code</label>
    <input id="code" placeholder="chai-tota-ludo-42" autocapitalize="off" spellcheck="false">
    <div class="row"><button type="submit" id="join">Join karo</button></div>
    <p class="err" id="err"></p>
    <p class="hint">Online with friends: one makes a room and reads out its code; the rest join with it. Bots fill a solo match.</p>
  </form>
</div>
<div id="msg" hidden>Panga load ho raha hai…</div>
<script type="module">
  const msg = document.getElementById("msg");
  const menu = document.getElementById("menu");
  const params = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);

  // The game reads its settings from the address (see crates/game/src/main.rs `setting`):
  // ?solo, ?host, ?join=<code>, with &name= and &map=.
  function go(extra) {
    const name = $("name").value.trim();
    try { localStorage.setItem("panga-name", name); } catch (_) {}
    const q = new URLSearchParams(extra);
    if (name) q.set("name", name);
    if (!q.has("join")) q.set("map", $("map").value);
    location.search = q.toString();
  }

  if (![...params.keys()].some((k) => ["solo", "host", "join", "map"].includes(k))) {
    try { $("name").value = localStorage.getItem("panga-name") || ""; } catch (_) {}
    menu.hidden = false;
    $("solo").onclick = () => go({ solo: "" });
    $("host").onclick = () => go({ host: "" });
    $("form").onsubmit = (e) => {
      e.preventDefault();
      const code = $("code").value.trim().toLowerCase().split(/[\s_-]+/).filter(Boolean).join("-");
      if (!/^[a-z]+-[a-z]+-[a-z]+-\d{1,3}$/.test(code)) { $("err").textContent = "Code aisa dikhta hai: chai-tota-ludo-42"; return; }
      go({ join: code });
    };
  } else if (!navigator.gpu) {
    msg.hidden = false;
    msg.textContent = "Panga needs WebGPU: use Chrome or Edge (desktop or Android) or Safari 26+ on iPhone.";
  } else {
    msg.hidden = false;
    // Watch for the game's canvas before starting it: once started, `init` never returns.
    new MutationObserver((_, obs) => { if (document.querySelector("canvas")) { msg.remove(); obs.disconnect(); } })
      .observe(document.body, { childList: true, subtree: true });
    const { default: init } = await import("./game.js");
    try { await init(); } catch (e) {
      // Bevy throws to hand control to the browser's event loop; that's not a failure.
      if (!String(e).includes("Using exceptions for control flow")) { msg.textContent = "Panga couldn't start: " + e; throw e; }
    }
  }
</script>
</body>
</html>
