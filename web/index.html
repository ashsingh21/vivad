<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panga</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="msg">Panga load ho raha hai…</div>
<script type="module">
  const msg = document.getElementById("msg");
  if (!navigator.gpu) {
    msg.textContent = "Panga needs WebGPU: use Chrome or Edge (desktop or Android) or Safari 26+ on iPhone.";
  } else {
    const { default: init } = await import("./game.js");
    try { await init(); } catch (e) {
      // Bevy throws to hand control to the browser's event loop; that's not a failure.
      if (!String(e).includes("Using exceptions for control flow")) { msg.textContent = "Panga couldn't start: " + e; throw e; }
    }
  }
  new MutationObserver(() => { if (document.querySelector("canvas")) msg.remove(); }).observe(document.body, { childList: true });
</script>
</body>
</html>
